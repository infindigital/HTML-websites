name: Deploy Roxy preview to GitHub Pages

# Publishes the roxy-houseboat site folder to GitHub Pages on every push
# to the preview branch. In the repo, set Settings → Pages → Source to
# "GitHub Actions" once, and the site goes live at the URL shown in the run.
on:
  push:
    branches:
      - claude/redesign-roxy-folder-bnouqg
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: "roxy-houseboat"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efe1" />

    <!-- TODO: once the real date is set, add it back into the description /
         keywords below (e.g. "…on 30 August 2026…") for richer share previews. -->
    <title>Imran &amp; Rashina — Wedding Invitation</title>
    <meta
      name="description"
      content="With love and joy, we invite you to celebrate our wedding. Tap to open the invitation."
    />
    <meta
      name="keywords"
      content="Imran and Rashina wedding, Muslim wedding, Nikah, digital wedding invitation, online wedding invite"
    />

    <!-- Open Graph / Facebook / WhatsApp. og:image is an absolute URL because
         this page is served from the /imran-rashina subpath. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Imran &amp; Rashina — Wedding Invitation" />
    <meta
      property="og:description"
      content="With love and joy, we invite you to celebrate our wedding. Tap to open the invitation."
    />
    <meta property="og:image" content="https://invite.infindigital.net/imran-rashina/preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Imran &amp; Rashina — Wedding Invitation" />
    <meta
      name="twitter:description"
      content="With love and joy, we invite you to celebrate our wedding. Tap to open the invitation."
    />
    <meta name="twitter:image" content="https://invite.infindigital.net/imran-rashina/preview.jpg" />

    <!-- Fonts: Cinzel (headings), Cormorant Garamond (names/body), Amiri (Arabic/Quran),
         Noto Serif Devanagari (Hindi), Noto Serif Kannada (Kannada) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Noto+Serif+Devanagari:wght@400;500;600&family=Noto+Serif+Kannada:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

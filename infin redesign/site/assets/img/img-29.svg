<svg xmlns="http://www.w3.org/2000/svg" width="1088" height="1445" viewBox="0 0 1088 1445">
  <defs>
    <pattern id="grid" width="90.67" height="90" patternUnits="userSpaceOnUse">
      <path d="M0 0H90.67M0 0V90" fill="none" stroke="#14130F" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1088" height="1445" fill="#EFECE6"/>
  <rect width="1088" height="790" fill="url(#grid)"/>

  <!-- Three small marks, echoing the rhythm above the fold. -->

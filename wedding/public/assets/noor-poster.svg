<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Noor - The Royal Invitation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#0d2a21"/><stop offset="1" stop-color="#061410"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.6"><stop offset="0" stop-color="#1c6a52" stop-opacity="0.5"/><stop offset="1" stop-color="#1c6a52" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6c879"/><stop offset="0.5" stop-color="#f4e6ab"/><stop offset="1" stop-color="#c9a63f"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect x="40" y="40" width="1520" height="820" fill="none" stroke="#f6f1e4" stroke-opacity="0.28" stroke-width="1.5"/>
  <rect x="52" y="52" width="1496" height="796" fill="none" stroke="url(#gold)" stroke-opacity="0.55" stroke-width="1"/>
  <!-- eight-point Islamic star -->
  <g transform="translate(800 214)" fill="none" stroke="url(#gold)" stroke-width="2.4">
    <rect x="-58" y="-58" width="116" height="116"/>
    <rect x="-58" y="-58" width="116" height="116" transform="rotate(45)"/>

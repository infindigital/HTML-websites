  </g>
  <text x="800" y="392" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="26" letter-spacing="9" fill="#f6f1e4" fill-opacity="0.72">THE ROYAL INVITATION</text>
  <text x="800" y="512" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="128" fill="#f6f1e4">Noor</text>
  <line x1="710" y1="556" x2="890" y2="556" stroke="url(#gold)" stroke-width="1.4"/>
  <text x="800" y="628" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="48" font-style="italic" fill="#f6f1e4" fill-opacity="0.92">Rayyan &amp; Inaya</text>

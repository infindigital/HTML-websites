<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Hindu wedding courtyard">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a0e"/>
      <stop offset="0.55" stop-color="#5a1810"/>
      <stop offset="1" stop-color="#e6771f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="86%" r="60%">
      <stop offset="0" stop-color="#ffd873" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#f0a13a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f0a13a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8862c"/><stop offset="0.5" stop-color="#f4e2a0"/><stop offset="1" stop-color="#b8862c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="820" rx="760" ry="420" fill="url(#glow)"/>
  <!-- ornate doorway silhouette -->
  <path d="M560 900 V360 Q800 120 1040 360 V900 Z" fill="#1c0508" opacity="0.92"/>
  <path d="M560 360 Q800 120 1040 360" fill="none" stroke="url(#gold)" stroke-width="7" opacity="0.85"/>
  <path d="M610 360 Q800 175 990 360" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>
  <!-- toran garland -->
  <g fill="#e6771f">
    <circle cx="600" cy="358" r="10"/><circle cx="660" cy="300" r="10"/><circle cx="730" cy="250" r="10"/>
    <circle cx="800" cy="232" r="11"/><circle cx="870" cy="250" r="10"/><circle cx="940" cy="300" r="10"/><circle cx="1000" cy="358" r="10"/>
  </g>
  <!-- diyas -->
  <g>
    <ellipse cx="430" cy="720" rx="150" ry="90" fill="#f0a13a" opacity="0.5"/>
    <path d="M370 730 Q430 780 490 730 Q430 748 370 730 Z" fill="url(#gold)"/>
    <path d="M430 690 C440 706 441 716 430 726 C419 716 420 706 430 690 Z" fill="#ffd873"/>
    <ellipse cx="1170" cy="720" rx="150" ry="90" fill="#f0a13a" opacity="0.5"/>
    <path d="M1110 730 Q1170 780 1230 730 Q1170 748 1110 730 Z" fill="url(#gold)"/>
    <path d="M1170 690 C1180 706 1181 716 1170 726 C1159 716 1160 706 1170 690 Z" fill="#ffd873"/>
  </g>
  <!-- petals -->
  <g fill="#f4c65a" opacity="0.8">
    <ellipse cx="250" cy="200" rx="8" ry="16"/><ellipse cx="1360" cy="260" rx="8" ry="16"/>
    <ellipse cx="380" cy="430" rx="7" ry="14"/><ellipse cx="1230" cy="470" rx="7" ry="14"/>
    <ellipse cx="180" cy="520" rx="6" ry="12"/><ellipse cx="1440" cy="560" rx="6" ry="12"/>
  </g>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
